title: smol
author: Matti Vuorre
version: 0.1.0
quarto-required: ">=1.11.0"
contributes:
  formats:
    html:
      # minimal turns off Bootstrap (theme: none) and every Quarto
      # feature that needs JavaScript: tabsets, copy buttons, anchors,
      # hover popups, responsive figures, code annotation popups.
      minimal: true
      # Pandoc writes MathML at build time, so no page loads a math script.
      # Without Bootstrap, Quarto doesn't pass --mathjax, and display math
      # would come out as raw $$...$$.
      html-math-method: mathml
      # Draw Mermaid diagrams at build time and inline them as SVG, instead
      # of loading 770 KB of Mermaid JS in the browser. Rendering a page
      # with a diagram needs Chrome or Chromium.
      mermaid-format: svg
      css: smol.css
      # Our own styles.html drops Pandoc's inline CSS; smol.css covers it.
      template-partials:
        - styles.html
        - title-block.html
      # ISO dates (2026-11-25). Sites can set their own date-format.
      date-format: iso
      # pre-render: after cross-references are numbered, while callouts and
      # tabsets are still Quarto's own nodes.
      filters:
        - path: smol.lua
          at: pre-render
